name: Deploy Backend — QA

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-aws-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 t4g.nano (qa / cuenta dev)
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Credenciales de la cuenta DEV (entorno QA)
      - name: Configure AWS credentials (dev account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region:            ${{ secrets.AWS_REGION_DEV }}

      # Lambda sigue viva hasta que Vercel apunte a la instancia (variable LEGACY_LAMBDA_ENABLED=false)
      - name: Build legacy Lambda package
        if: vars.LEGACY_LAMBDA_ENABLED != 'false'
        run: bash infra/scripts/build_lambda.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # El backend apunta al bucket tfstate de la cuenta DEV
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config=backends/qa.tfbackend

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_IN_AUTOMATION: "true"
        run: |
          terraform apply -auto-approve \
            -var "environment=qa" \
            -var "admin_email=${{ secrets.ADMIN_EMAIL_DEV }}" \
            -var "admin_password=${{ secrets.ADMIN_PASSWORD_DEV }}" \
            -var "secret_key=${{ secrets.SECRET_KEY_DEV }}" \
            -var "cors_origins=${{ secrets.CORS_ORIGINS_QA }}" \
            -var "aws_region=${{ secrets.AWS_REGION_DEV }}" \
            -var "api_domain=${{ vars.API_DOMAIN }}" \
            -var "legacy_lambda_enabled=${{ vars.LEGACY_LAMBDA_ENABLED != 'false' }}" \
            -var "monthly_budget_usd=10"

      - name: Deploy backend to EC2 (S3 + SSM)
        run: bash infra/scripts/deploy_backend.sh "${{ github.sha }}"

      - name: Show API URL
        working-directory: infra/terraform
        run: |
          echo "API_URL para Vercel: $(terraform output -raw api_url)"
          echo "IP pública:          $(terraform output -raw api_public_ip)"
