name: Deploy Backend — Production

on:
  workflow_run:
    workflows: ["Test Backend"]
    types: [completed]
    branches: [master]

concurrency:
  group: deploy-aws-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 t4g.nano (prod / cuenta prod)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Credenciales de la cuenta PROD (completamente separada de la cuenta dev)
      - name: Configure AWS credentials (prod account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region:            ${{ secrets.AWS_REGION_PROD }}

      # Lambda sigue viva hasta que Vercel apunte a la instancia (variable LEGACY_LAMBDA_ENABLED=false)
      - name: Build legacy Lambda package
        if: vars.LEGACY_LAMBDA_ENABLED != 'false'
        run: bash infra/scripts/build_lambda.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      # El backend apunta al bucket tfstate de la cuenta PROD
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend-config=backends/prod.tfbackend

      - name: Terraform apply
        working-directory: infra/terraform
        env:
          TF_IN_AUTOMATION: "true"
        run: |
          terraform apply -auto-approve \
            -var "environment=prod" \
            -var "admin_email=${{ secrets.ADMIN_EMAIL_PROD }}" \
            -var "admin_password=${{ secrets.ADMIN_PASSWORD_PROD }}" \
            -var "secret_key=${{ secrets.SECRET_KEY_PROD }}" \
            -var "cors_origins=${{ secrets.CORS_ORIGINS_PROD }}" \
            -var "aws_region=${{ secrets.AWS_REGION_PROD }}" \
            -var "api_domain=${{ vars.API_DOMAIN }}" \
            -var "legacy_lambda_enabled=${{ vars.LEGACY_LAMBDA_ENABLED != 'false' }}" \
            -var "monthly_budget_usd=10"

      - name: Deploy backend to EC2 (S3 + SSM)
        run: bash infra/scripts/deploy_backend.sh "${{ github.event.workflow_run.head_sha }}"

      - name: Show API URL
        working-directory: infra/terraform
        run: |
          echo "API_URL para Vercel: $(terraform output -raw api_url)"
          echo "IP pública:          $(terraform output -raw api_public_ip)"
